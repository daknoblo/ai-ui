# Example: ONE ai-ui container. Copy this file to docker-compose.yml or paste it
# into Dockge. The project is designed for exactly one container; how many
# instances of it you run is up to you.
#
# Data path: the container runs as non-root (UID/GID 65532) and uses a Docker
# managed named volume. The volume inherits the permissions from the image and
# therefore works out of the box, including in Dockge/Portainer as a normal user.

services:
  ai-ui:
    image: ghcr.io/daknoblo/ai-ui:latest
    container_name: ai-ui
    restart: unless-stopped
    environment:
      # Secret via environment variable only (never in the config file).
      - AZURE_API_KEY=${AZURE_API_KEY}
      # Optional: dedicated key if embeddings live on a separate Azure resource.
      - AZURE_EMBEDDING_API_KEY=${AZURE_EMBEDDING_API_KEY:-}
      # Optional: API key for web search (Tavily/Brave). Not needed for SearXNG.
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}
      - PORT=8080
      - DATA_DIR=/appdata
      # IANA time zone; the binary bundles tzdata for distroless.
      - TZ=${TZ:-Europe/Berlin}
      # Interval of the periodic connection check (e.g. 30s, 2m; 0/off = never).
      - HEALTHCHECK_INTERVAL=${HEALTHCHECK_INTERVAL:-60s}
      # Models offered in the chat header. The model router does not expose
      # which models it serves, so the list is curated here (comma separated).
      - AZURE_MODELS=${AZURE_MODELS:-gpt-5.5,claude-opus-4-7,claude-sonnet-4-5,claude-haiku-4-5,gpt-oss-120b,grok-4-1-fast-reasoning}
      # Optional: pin the endpoint settings via environment variables.
      # Values that are set take precedence over config.json and are disabled
      # in the UI.
      # - AZURE_ENDPOINT=${AZURE_ENDPOINT:-}
      # - AZURE_DEPLOYMENT=${AZURE_DEPLOYMENT:-}
      # - AZURE_API_VERSION=${AZURE_API_VERSION:-}
      # - AZURE_EMBEDDING_ENDPOINT=${AZURE_EMBEDDING_ENDPOINT:-}
      # - AZURE_EMBEDDING_DEPLOYMENT=${AZURE_EMBEDDING_DEPLOYMENT:-}
      # - AZURE_EMBEDDING_API_VERSION=${AZURE_EMBEDDING_API_VERSION:-}
    ports:
      - "8080:8080"
    volumes:
      # Persistent data path (Docker managed named volume): chats, documents,
      # embeddings and configuration. The container runs non-root (UID/GID
      # 65532); the named volume inherits those permissions from the image, so
      # nothing has to be set up manually.
      - ai-ui-data:/appdata
    # ---- Hardening (optional but recommended) ----
    # The application only writes to /appdata and to a temporary directory.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ---- Alternative to ports: Traefik ----
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.ai-ui.rule=Host(`chat.example.com`)"
    #   - "traefik.http.routers.ai-ui.entrypoints=websecure"
    #   - "traefik.http.routers.ai-ui.tls=true"
    #   - "traefik.http.routers.ai-ui.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.ai-ui.loadbalancer.server.port=8080"
    # networks:
    #   - traefik

volumes:
  ai-ui-data:

# ---- Only needed when the Traefik networks above are enabled ----
