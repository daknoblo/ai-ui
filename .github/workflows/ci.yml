name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # go.mod declares a minimum; CI must use the patched 1.26 runtime.
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: gofmt (check formatting)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: Build (static, CGO-free)
        run: CGO_ENABLED=0 go build ./...

  browser:
    name: Browser regressions (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [en, de]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/screenshots/package-lock.json

      - name: Install browser test tooling
        working-directory: tools/screenshots
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the isolated demo
        run: CGO_ENABLED=0 go build -o bin/ai-ui-demo ./cmd/demo

      - name: Test desktop and mobile workflows
        working-directory: tools/screenshots
        run: node capture.mjs --bin=../../bin/ai-ui-demo --checks-only --langs=${{ matrix.language }}
