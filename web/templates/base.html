{{define "base"}}<!DOCTYPE html>
<html lang="{{lang}}">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{.Title}}</title>
	<link rel="stylesheet" href="/static/app.css">
	<script src="/static/htmx.min.js"></script>
	<script src="/static/sse.js"></script>
	<script src="/static/upload.js"></script>
</head>
<body>
	<div class="app">
		{{template "sidebar" .}}
		<main class="main">
			{{block "content" .}}{{end}}
		</main>
	</div>
	{{block "modal" .}}{{end}}
	<script>
		// Strings used by upload.js. They are rendered here so the browser side
		// follows the language configured in the settings.
		window.AIUI_I18N = {
			uploadStart: "{{t `js.upload_start`}}",
			processing: "{{t `js.processing`}}",
			processingShort: "{{t `js.processing_n`}}",
			summary: "{{t `js.summary`}}",
			failed: "{{t `js.failed`}}"
		};

		// Scroll to the bottom after every HTMX swap in the message area.
		function scrollMessages() {
			var m = document.getElementById('messages');
			if (m) { m.scrollTop = m.scrollHeight; }
		}
		document.body.addEventListener('htmx:afterSwap', scrollMessages);
		document.body.addEventListener('htmx:sseMessage', scrollMessages);
		window.addEventListener('load', scrollMessages);

		// Web search toggle: the state is kept per browser (localStorage) so it
		// survives switching chats. The value is submitted as the form field
		// "web" when a message is sent.
		function webEnabled() {
			return localStorage.getItem('ai-ui-web') === '1';
		}
		function applyWebState(btn) {
			if (!btn) return;
			var on = webEnabled();
			btn.setAttribute('aria-pressed', on ? 'true' : 'false');
			btn.classList.toggle('active', on);
			var flag = document.getElementById('web-flag');
			if (flag) flag.value = on ? '1' : '0';
		}
		function toggleWeb(btn) {
			localStorage.setItem('ai-ui-web', webEnabled() ? '0' : '1');
			applyWebState(btn);
		}
		// Restore the hidden flag value after the form was reset on submit.
		function syncWebToggle() {
			applyWebState(document.getElementById('web-toggle'));
		}
		function initWebToggle() {
			applyWebState(document.getElementById('web-toggle'));
		}
		window.addEventListener('load', initWebToggle);
		document.body.addEventListener('htmx:afterSwap', initWebToggle);
	</script>
</body>
</html>
{{end}}
