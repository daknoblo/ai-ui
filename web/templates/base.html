{{define "base"}}<!DOCTYPE html>
<html lang="{{lang}}">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{.Title}}</title>
	<link rel="stylesheet" href="/static/app.css">
	<script src="/static/htmx.min.js"></script>
	<script src="/static/sse.js"></script>
	<script src="/static/upload.js"></script>
</head>
<body>
	<div class="app">
		{{template "sidebar" .}}
		<main class="main">
			{{block "content" .}}{{end}}
		</main>
	</div>
	{{block "modal" .}}{{end}}
	<script>
		// Strings used by upload.js. They are rendered here so the browser side
		// follows the language configured in the settings.
		window.AIUI_I18N = {
			uploadStart: "{{t `js.upload_start`}}",
			processing: "{{t `js.processing`}}",
			processingShort: "{{t `js.processing_n`}}",
			summary: "{{t `js.summary`}}",
			failed: "{{t `js.failed`}}"
		};

		// Scroll to the bottom after every HTMX swap in the message area.
		function scrollMessages() {
			var m = document.getElementById('messages');
			if (m) { m.scrollTop = m.scrollHeight; }
		}
		document.body.addEventListener('htmx:afterSwap', scrollMessages);
		document.body.addEventListener('htmx:sseMessage', scrollMessages);
		window.addEventListener('load', scrollMessages);

		// Composer state: web search and chat/image mode are kept per browser
		// (localStorage) so they survive switching chats. Both are submitted as
		// hidden form fields ("web" and "mode") when a message is sent.
		function webEnabled() {
			return localStorage.getItem('ai-ui-web') === '1';
		}
		function imageEnabled() {
			return localStorage.getItem('ai-ui-image') === '1';
		}
		// Editing the latest image of the chat is the default in image mode.
		function editEnabled() {
			return localStorage.getItem('ai-ui-edit') !== '0';
		}
		function setWeb(on) {
			localStorage.setItem('ai-ui-web', on ? '1' : '0');
			applyComposerState();
		}
		function setMode(mode) {
			localStorage.setItem('ai-ui-image', mode === 'image' ? '1' : '0');
			applyComposerState();
		}
		function setEdit(on) {
			localStorage.setItem('ai-ui-edit', on ? '1' : '0');
			applyComposerState();
		}
		function applyComposerState() {
			var image = imageEnabled();
			var web = webEnabled() && !image;
			var box = document.querySelector('.composer');
			var hasImage = box && box.dataset.hasImage === '1';
			var edit = image && hasImage && editEnabled();

			document.querySelectorAll('.mode-opt').forEach(function (btn) {
				var on = (btn.dataset.mode === 'image') === image;
				btn.classList.toggle('active', on);
				btn.setAttribute('aria-pressed', on ? 'true' : 'false');
			});

			var webCheck = document.getElementById('web-check');
			if (webCheck) webCheck.checked = web;
			var webOption = document.getElementById('web-option');
			if (webOption) webOption.hidden = image;
			var editCheck = document.getElementById('edit-check');
			if (editCheck) editCheck.checked = edit;
			var editOption = document.getElementById('edit-option');
			if (editOption) editOption.hidden = !(image && hasImage);
			var params = document.getElementById('image-params');
			if (params) params.hidden = !image;

			var webFlag = document.getElementById('web-flag');
			if (webFlag) webFlag.value = web ? '1' : '0';
			var modeFlag = document.getElementById('mode-flag');
			if (modeFlag) modeFlag.value = image ? 'image' : 'chat';
			var editFlag = document.getElementById('edit-flag');
			if (editFlag) editFlag.value = edit ? '1' : '0';

			if (box) box.classList.toggle('image-mode', image);
			var ta = document.querySelector('#chat-form textarea');
			if (ta && ta.dataset.placeholderImage) {
				ta.placeholder = image ? ta.dataset.placeholderImage : ta.dataset.placeholderChat;
			}
		}
		window.addEventListener('load', applyComposerState);
		document.body.addEventListener('htmx:afterSwap', applyComposerState);
	</script>
</body>
</html>
{{end}}
